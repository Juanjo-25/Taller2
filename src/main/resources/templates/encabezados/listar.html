<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Compras | Yate</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragmentos/menu :: menu}"></div><main><h1 th:text="${esAdmin ? 'Ventas' : 'Mis compras'}"></h1><a th:unless="${esAdmin}" class="boton" th:href="@{/encabezados/compra}">Realizar compra</a><p th:if="${#lists.isEmpty(compras)}">No hay compras registradas.</p><div class="tabla"><table th:unless="${#lists.isEmpty(compras)}"><thead><tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Acciones</th></tr></thead><tbody><tr th:each="compra : ${compras}"><td th:text="${compra.id}"></td><td th:text="${compra.cliente.nombre + ' ' + compra.cliente.apellido}"></td><td th:text="${#temporals.format(compra.fecha, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatDecimal(compra.total, 1, 2)}"></td><td><a th:href="@{/encabezados/ver/{id}(id=${compra.id})}">Ver factura</a></td></tr></tbody></table></div></main></body></html>
