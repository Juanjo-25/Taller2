<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo}"></title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><nav th:replace="~{fragmentos/menu :: menu}"></nav><main><h1 th:text="${titulo}"></h1>
<p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><a class="boton" th:href="@{/productos/form}">Nuevo producto</a>
<p th:if="${#lists.isEmpty(productos)}">Todavía no hay productos registrados.</p>
<div class="tabla"><table th:unless="${#lists.isEmpty(productos)}">
<thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Valor unitario</th><th>Stock</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="producto : ${productos}"><td th:text="${producto.id}"></td><td th:text="${producto.nombre}"></td><td th:text="${producto.descripcion}"></td><td th:text="${#numbers.formatDecimal(producto.valorUnitario, 1, 2)}"></td><td th:text="${producto.stock}"></td>
<td class="acciones"><a th:href="@{/productos/form/{id}(id=${producto.id})}">Editar</a><form th:action="@{/productos/eliminar/{id}(id=${producto.id})}" method="post" onsubmit="return confirm('¿Eliminar este producto?');"><button class="eliminar" type="submit">Eliminar</button></form></td>
</tr></tbody></table></div></main></body></html>
