<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>
    <main>
        <h1 th:text="${titulo}"></h1>
        <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
        <p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
        <a class="boton" th:href="@{/clientes/form}">Nuevo cliente</a>
        <p th:if="${#lists.isEmpty(clientes)}">Todavía no hay clientes registrados.</p>
        <div class="tabla">
            <table th:unless="${#lists.isEmpty(clientes)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.apellido}"></td>
                        <td th:text="${cliente.email}"></td>
                        <td th:text="${#dates.format(cliente.createAt, 'dd/MM/yyyy')}"></td>
                        <td class="acciones"><a th:href="@{/clientes/form/{id}(id=${cliente.id})}">Editar</a>
                            <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}" method="post"
                                onsubmit="return confirm('¿Eliminar este cliente?');"><button class="eliminar"
                                    type="submit">Eliminar</button></form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
