<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | Yate</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <div th:replace="~{fragmentos/menu :: menu}"></div>
    <main>
        <h1>Mi perfil</h1>
        <p th:if="${cliente.id == null}">Complete sus datos personales para continuar.</p>
        <p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
        <form class="formulario" th:action="@{/clientes/perfil}" th:object="${cliente}" method="post">
            <label for="nombre">Nombre</label><input id="nombre" th:field="*{nombre}" required maxlength="100"
                autocomplete="given-name"><span class="error" th:errors="*{nombre}"></span>
            <label for="apellido">Apellido</label><input id="apellido" th:field="*{apellido}" required maxlength="100"
                autocomplete="family-name"><span class="error" th:errors="*{apellido}"></span>
            <label for="email">Correo de contacto</label><input id="email" type="email" th:field="*{email}" required
                maxlength="254" autocomplete="email"><span class="error" th:errors="*{email}"></span>
            <small>El correo de contacto puede cambiar. Para ingresar, siga usando el correo con el que registró su
                cuenta.</small>
            <button type="submit">Guardar mis datos</button>
        </form>
    </main>
</body>

</html>
