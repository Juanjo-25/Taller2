<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cuentas pendientes | Yate</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><div th:replace="~{fragmentos/menu :: menu}"></div><main>
<h1>Cuentas pendientes</h1><p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
<p th:if="${#lists.isEmpty(cuentas)}">No hay solicitudes pendientes.</p>
<div class="tabla"><table th:unless="${#lists.isEmpty(cuentas)}"><thead><tr><th>Correo</th><th>Estado</th><th>Rol y aprobación</th></tr></thead>
<tbody><tr th:each="cuenta : ${cuentas}"><td th:text="${cuenta.email}"></td><td>Pendiente</td>
<td><form class="acciones" th:action="@{/login/activar/{id}(id=${cuenta.id})}" method="post">
<label th:for="${'rol-' + cuenta.id}">Rol</label><select th:id="${'rol-' + cuenta.id}" name="rol" required><option value="CLIENTE">Cliente</option><option th:if="${esSuperAdmin}" value="ADMIN">Admin</option><option th:if="${esSuperAdmin}" value="SUPER_ADMIN">Superadministrador</option></select>
<button type="submit">Activar cuenta</button></form></td></tr></tbody></table></div>
</main></body></html>
