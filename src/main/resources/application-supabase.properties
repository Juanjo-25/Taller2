# Activar con SPRING_PROFILES_ACTIVE=supabase.
# Usar los datos de Connect > Session pooler. La contraseña va por separado.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-us-east-2.pooler.supabase.com}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER:postgres.mpdgevpqsdxwoexaunxu}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Esquema propio para las tablas de la aplicación.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/supabase.sql
spring.jpa.properties.hibernate.default_schema=yate
spring.jpa.hibernate.ddl-auto=update
